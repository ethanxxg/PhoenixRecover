<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>P4 恢复目标 - PhoenixRecover 原型</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="p4">
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="title">PhoenixRecover</div><div class="ver">v1.0</div>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">原型入口</a>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="nav">
          <div class="nav-group">数据恢复</div>
          <a href="p1_location.html" data-page="p1">位置选择</a>
          <a href="p3_results.html" data-page="p3">结果&预览</a>
          <a class="active" href="p4_target.html" data-page="p4">恢复目标</a>
          <a href="p5_complete.html" data-page="p5">完成</a>
        </div>
      </aside>

      <main class="content">
        <div class="page-title">选择恢复位置</div>

        <div class="kv">
          <div class="item"><div class="k">待恢复文件</div><div class="v">12 个</div></div>
          <div class="item"><div class="k">总大小</div><div class="v">1.2 GB</div></div>
          <div class="item"><div class="k">源盘覆盖检测</div><div class="v" style="color:var(--success)">通过</div></div>
          <div class="item"><div class="k">剩余空间</div><div class="v">80 GB</div></div>
        </div>

        <div class="section">
          <h3>目标路径</h3>
          <div class="row" style="gap:10px;flex-wrap:wrap">
            <input style="height:38px;border-radius:10px;border:1px solid #d1d5db;padding:0 12px;min-width:380px"
                   value="D:\Recovered\" />
            <a class="btn" href="#" onclick="alert('原型占位：选择文件夹对话框');return false;">选择文件夹...</a>
          </div>
          <div class="note">提示：恢复位置不能与源盘相同（避免覆盖）。</div>
        </div>

        <div class="section">
          <h3>校验区</h3>
          <div class="card-grid">
            <div class="card">
              <div class="icon">✓</div>
              <div class="meta">
                <div class="name">路径可写</div>
                <div class="sub">目标目录可写入</div>
              </div>
            </div>
            <div class="card">
              <div class="icon">✓</div>
              <div class="meta">
                <div class="name">空间充足</div>
                <div class="sub">剩余空间 ≥ 待恢复总大小</div>
              </div>
            </div>
            <div class="card">
              <div class="icon">✓</div>
              <div class="meta">
                <div class="name">不覆盖源盘</div>
                <div class="sub">目标盘符与源盘不同</div>
              </div>
            </div>
          </div>
        </div>

        <div class="footer-actions">
          <button class="btn" id="backToResults" type="button">返回</button>
          <button class="btn primary" id="startRecover" type="button">开始恢复</button>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
