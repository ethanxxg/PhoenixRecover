<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>P2 扫描中 - PhoenixRecover 原型</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .progress-wrap{height:8px;border-radius:999px;background:#e5e7eb;overflow:hidden;border:1px solid #e6eaf2}
    .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#7c3aed)}
  </style>
</head>
<body data-page="p2">
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="title">PhoenixRecover</div><div class="ver">v1.0</div>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">原型入口</a>
      </div>
    </div>

    <div class="layout single">
      <main class="content">
        <div class="scan-header">
          <div>
            <div class="scan-title">扫描 <span id="scanTargetText">本地磁盘(C:)</span> — 当前阶段：<span id="scanModeText">元数据解析</span></div>
            <div class="scan-sub" id="scanStageIndicator">阶段 1/3: FS 元数据解析</div>
          </div>
          <div class="scan-actions">
            <button class="btn stop" id="stopScan" type="button">停止</button>
          </div>
        </div>

        <div class="progress-wrap" style="margin:0 -26px">
          <div class="progress-bar" id="progressBar" style="background:var(--primary2)"></div>
        </div>

        <div class="scan-kpis" aria-label="scan-metrics">
          <span class="k"><b id="mFound">0</b> <span>已找到</span></span>
          <span class="sep">|</span>
          <span class="k"><b id="mScanned">0 GB</b> <span>已扫描</span></span>
          <span class="sep">|</span>
          <span class="k"><b id="mTotal">500 GB</b> <span>总计</span></span>
          <span class="sep">|</span>
          <span class="k"><b id="mElapsed">00:00</b> <span>用时</span></span>
          <span class="sep">|</span>
          <span class="k"><b id="mSpeed">0 MB/s</b> <span>速度</span></span>
        </div>

        <div class="view-tabs">
          <a class="active" href="#" data-tab="path" onclick="return false;">路径</a>
          <a href="#" data-tab="type" onclick="return false;">类型</a>
        </div>

        <div class="split no-preview">
          <div class="panel tree-panel">
            <div class="tree">
              <div id="treePath">
                <div id="pathTreeNodes">
                  <!-- 动态插入：路径树（可展开多层） -->
                </div>
              </div>
              <div id="treeType" class="hidden">
                <div id="typeNodes">
                  <!-- 动态插入：类型节点 -->
                </div>
              </div>
            </div>
          </div>
          <div class="panel file-panel">
            <div class="table-scroll" id="fileTableWrap">
              <table>
                <thead>
                  <tr>
                    <th style="width:34px"><input type="checkbox" /></th>
                    <th>名称</th>
                    <th style="width:90px">大小</th>
                    <th style="width:100px">类型</th>
                    <th style="width:120px">修改时间</th>
                    <th style="width:110px">可恢复性</th>
                  </tr>
                </thead>
                <tbody id="fileRows"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="scan-footer">
          <div class="scan-footer-left">
            <div class="dot"></div>
            <div>扫描中，已找到文件：<b id="p2FoundFooter">0</b></div>
          </div>
          <div class="scan-footer-right">
            <div class="note">提示：仅原型演示</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
